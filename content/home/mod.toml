# DreamWeave Theme as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `theme-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "817cd62f-bacb-4786-815c-fb47ab2fe80a"
slug = "theme"
type = "assets"
status = "active"
license = "MIT OR Apache-2.0"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.theme"

[[releases]]
version = "0.2.0"
date = 2026-10-19
summary = "First release published as a DreamWeave project."

[[releases]]
version = "0.2.1"
date = 2026-11-26
summary = "Releases of one date come in the order they are declared, and the stable link finds its release when the landing page doesn't show it."
fixed = [
    "Releases that share a date are listed newest declared first, instead of in whatever order the generator's sort left them, which dropped one of four from the landing page's three newest.",
    "The landing page's Stable link goes to the changelog page's entry when its release isn't among those the landing shows, instead of to an anchor the page doesn't have.",
]
