# DreamWeave Theme as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `theme-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "817cd62f-bacb-4786-815c-fb47ab2fe80a"
slug = "theme"
type = "assets"
status = "active"
license = "MIT OR Apache-2.0"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.theme"

[[releases]]
version = "0.2.0"
date = 2026-10-19
summary = "First release published as a DreamWeave project."
